# Shared Voice teacher. Separate Fly app and Neon `voice` database.
# Never point this at woolgrown-command or showroom neondb.
# DATABASE_URL + DIRECT_URL + OPENAI_API_KEY + VOICE_API_SECRET via `fly secrets`.

app = 'lindsay-voice'
primary_region = 'yyz'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3030'
  HOSTNAME = '0.0.0.0'

[http_service]
  internal_port = 3030
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
