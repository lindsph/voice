# Shared Voice teacher. Separate Fly app and Neon `voice` database.
# Never point this at woolgrown-command or showroom neondb.
# DATABASE_URL + DIRECT_URL + OPENAI_API_KEY + VOICE_API_SECRET via `fly secrets`.

app = 'lindsay-voice'
primary_region = 'yyz'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3030'
  HOSTNAME = '::'

[http_service]
  internal_port = 3030
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

# Longer than the 8-minute Command wait, so a silent Claude draft is not cut here first.
[http_service.http_options]
  idle_timeout = 600

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
